  build_wheels_mac:
    # build wheels for macOS, using an x86_64-based runner to build both x86_64 and arm64 wheels
    # (better would be to build arm64 wheels on an arm64-based runner, but c++ compilation throws errors and haven't debugged why)
    # - arm64 wheels can only be build for python 3.8+
    # - arm64 wheels cannot be tested on an x86_64-based runner, so they are tested in a separate job
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
    name: Build ${{ matrix.py }}-${{ matrix.cibw_arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel] # runner hardware is x86_64 (intel)
        # macos-14(-large) uses clang 15. clang 17 causes problems with openmp?
        # os: [macos-15] # runner hardware is arm64 (apple silicon)
        # py: [cp38, cp39, cp310, cp311, cp312, cp313]
        py: [cp312]  # DEBUG: single version for faster iteration
        # py: [cp36, cp37, cp38, cp39, cp310, cp311, cp312, cp313]
        # cibw_arch: [x86_64, arm64]
        cibw_arch: [x86_64]  # DEBUG: only x86_64 for now
        include:
          - cibw_test_requires: 'pytest tensorflow'
          # cibuildwheel 3.x only works with python 3.8+
          - cibw_version: '>=3'
          # - py: cp36
          #   cibw_version: '<3'
          # - py: cp37
          #   cibw_version: '<3'
        exclude:
          # - py: cp36
          #   cibw_arch: arm64
          # - py: cp37
          #   cibw_arch: arm64
          # no tensorflow x86_64 wheels for python 3.13+
          - py: cp313
            cibw_arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel${{ matrix.cibw_version }}"

      - name: Install conda
        shell: bash
        run: |
          set -ex
          MINIFORGE_URL="https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-$(uname -m).sh"
          MINIFORGE_PATH="$HOME/miniforge"
          curl -L --retry 10 $MINIFORGE_URL -o ./miniforge.sh
          bash ./miniforge.sh -b -p $MINIFORGE_PATH
          echo "CONDA_HOME=$MINIFORGE_PATH" >> $GITHUB_ENV

      - name: Build wheels for CPython (macOS)
        run: |
          if [[ "$CIBW_ARCHS_MACOS" == "arm64" ]]; then
              # SciPy requires 12.0 on arm to prevent kernel panics
              # https://github.com/scipy/scipy/issues/14688
              export MACOSX_DEPLOYMENT_TARGET=12.0
          else
              # Match Homebrew llvm@14's libunwind minimum target
              export MACOSX_DEPLOYMENT_TARGET=14.0
          fi
          echo MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}

          # Use Homebrew llvm@14 for both compiler and OpenMP runtime
          brew install llvm@14
          LLVM_PREFIX=$(brew --prefix llvm@14)
          export CC=$LLVM_PREFIX/bin/clang
          export CXX=$LLVM_PREFIX/bin/clang++
          export CFLAGS="$CFLAGS -I$LLVM_PREFIX/include"
          export CXXFLAGS="$CXXFLAGS -I$LLVM_PREFIX/include"
          export LDFLAGS="$LDFLAGS -L$LLVM_PREFIX/lib -L$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib"

          python -m cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "${{ matrix.py }}-*"
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_arch }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_REQUIRES: "${{ matrix.cibw_test_requires }}"
          CIBW_TEST_COMMAND: pytest -v -m "not gpu" {project}
          # CIBW_TEST_SKIP: "*"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.py }}-${{ matrix.os }}-${{ matrix.cibw_arch }}
          path: dist/*.whl


