  # x86_64 wheels: use GCC-13 (same as tests.yml) with MACOSX_DEPLOYMENT_TARGET=14.0
  build_wheels_mac_x86_64:
    name: Build ${{ matrix.py }}-x86_64 wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
        # Reduced matrix for debugging - restore after fix
        py: [cp312]
        include:
          - cibw_test_requires: 'pytest tensorflow'
          - cibw_version: '>=3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel${{ matrix.cibw_version }}"

      - name: Build wheels for CPython (macOS x86_64)
        run: python -m cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "${{ matrix.py }}-*"
          CIBW_ARCHS_MACOS: x86_64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_REQUIRES: "${{ matrix.cibw_test_requires }}"
          CIBW_TEST_COMMAND: pytest -v -m "not gpu" {project}
          # GCC-13 works reliably with OpenMP on macOS, Homebrew libs require 14.0
          CIBW_ENVIRONMENT: >-
            CC=gcc-13
            CXX=g++-13
            MACOSX_DEPLOYMENT_TARGET=14.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.py }}-${{ matrix.os }}-x86_64
          path: dist/*.whl


  # arm64 wheels: build natively on ARM runner using GCC-13
  build_wheels_mac_arm64:
    name: Build ${{ matrix.py }}-arm64 wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]  # ARM runner
        # Reduced matrix for debugging - restore after fix
        py: [cp312]
        include:
          - cibw_test_requires: 'pytest tensorflow'
          - cibw_version: '>=3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel${{ matrix.cibw_version }}"

      - name: Build wheels for CPython (macOS arm64)
        run: python -m cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "${{ matrix.py }}-*"
          CIBW_ARCHS_MACOS: arm64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_REQUIRES: "${{ matrix.cibw_test_requires }}"
          CIBW_TEST_COMMAND: pytest -v -m "not gpu" {project}
          # GCC-13 works reliably with OpenMP on macOS
          CIBW_ENVIRONMENT: >-
            CC=gcc-13
            CXX=g++-13
            MACOSX_DEPLOYMENT_TARGET=12.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.py }}-${{ matrix.os }}-arm64
          path: dist/*.whl


