  # ============================================================================
  # macOS arm64 wheels (scikit-learn style: llvm-openmp + clang)
  # ============================================================================

  build_wheels_mac_arm64:
    name: Build ${{ matrix.py }}-arm64 wheel
    runs-on: macos-14
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        py: [cp310, cp311, cp312]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest

      - name: Build wheel
        run: bash build_tools/wheels/build_wheels.sh
        env:
          CIBW_BUILD: "${{ matrix.py }}-macosx_arm64"
          CIBW_ARCHS_MACOS: arm64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_SKIP: "*"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.py }}-macos-14-arm64
          path: wheelhouse/*.whl

  test_wheels_mac_arm64:
    name: Test ${{ matrix.py }}-arm64 wheel
    needs: build_wheels_mac_arm64
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        py: [cp310, cp311, cp312]
        include:
          - py: cp310
            python-version: '3.10'
          - py: cp311
            python-version: '3.11'
          - py: cp312
            python-version: '3.12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: cibw-${{ matrix.py }}-macos-14-arm64
          path: dist

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest tensorflow
          python -m pip install dist/*.whl

      - name: Run tests
        run: pytest -v -m "not gpu" .


